# One-shot traversability core params. A single pre-built reconstructed cloud (a PLY
# map, already in the map frame) is ingested as ONE keyframe at identity pose and binned
# exactly once (see one_shot_traversability_node). Same schema as traversabilityParams.yaml;
# differences from the streaming (global/local) files are called out inline.

# --- Grid geometry ---
grid/resolution_local_map: 0.05          # 5 cm cells
grid/grid_center_x: 0.0
grid/grid_center_y: 0.0
grid/half_size_traversability: 40.0      # initial half-extent (m); the grid auto-grows to fit the whole cloud
grid/extend_length_every_resize_by: 40.0

# --- Traversability (per-cell hazard metric) ---
# ONE-SHOT: deltaInd_ = max(1, ceil((security_distance/2)/resolution)) sets the vicinity
# half-window (in cells). With resolution = 0.05, security_distance = 0.10 gives
# (0.10/2)/0.05 = 1.0 -> deltaInd_ = 1 -> a 3x3 window (the query cell + its 8 neighbours),
# and nothing wider. Keep security_distance <= 2*resolution to stay at 3x3.
traversability/security_distance: 0.10
traversability/ground_clearance: 0.15
traversability/max_slope: 0.4
traversability/min_vicinity_points: 15
traversability/min_occupied_fraction: 0.5

# --- Mapping (keyframe retention + worker scheduling) ---
# ONE-SHOT: a single keyframe, binned exactly once. No PGO / re-bin, so the cloud is
# dropped after the first bin.
mapping/is_kf_optimization_enabled: false
mapping/num_local_keyframes: 1
mapping/global_adjustment_sleep: 0

# --- Ingestion (cloud filtering) ---
# ONE-SHOT: the cloud is already a full map in the map frame, so ALL of the per-scan
# pruning in System::pruneToBase is disabled -- every point is ingested unchanged.
# (Range is measured from the map origin; the normal 10 m cap would keep only a small
# disc around it, and the height cull would clip the map by absolute z.)
ingestion/robot_height: 1.0e9            # disable ceiling/overhang cull (absolute z)
ingestion/max_range_base_frame: 1.0e9    # disable far-range cull (keep the whole footprint)
ingestion/min_range_base_frame: 0.0      # disable near-range cull
ingestion/use_pointcloud_buffer: false
ingestion/use_ros_buffer: false

# --- Publishing (node) ---
node/publish_rate_hz: 1.0                # unused by the one-shot node (it latches on the single bin)
