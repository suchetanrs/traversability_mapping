# Local traversability core params. Same schema as traversabilityParams.yaml, tuned for
# a small robot-centered rolling-window map (see local_traversability_node). Differences
# from the global file are called out inline.

# --- Local grid geometry ---
# Grid is fixed-frame and grows as the robot roams (accepted); consumers only ever see a
# robot-centered crop (node crop_size_*). Keep half_size >= lidar range so a scan fits.
grid/resolution_local_map: 0.05
grid/grid_center_x: 0.0
grid/grid_center_y: 0.0
grid/half_size_traversability: 10.0      # initial half-extent (m); >= max_range_base_frame
grid/extend_length_every_resize_by: 30.0

# --- Traversability (per-cell hazard metric) --- (unchanged from global)
traversability/robot_radius: 0.20        # robot footprint radius (m); the plane-fit disc
traversability/ground_clearance: 0.15
traversability/max_slope: 0.4
traversability/min_points_per_grid: 5

# --- Inflation (Nav2-style buffer around step hazards) ---
# Step hazard (normalised [0,1]) seeds an exponentially-decaying buffer written to a
# separate step_haz_inflated layer; hazard is untouched. Incremental with the map.
inflation/enabled: true
inflation/inflation_radius: 0.5          # kernel extent (m)
inflation/cost_scaling_factor: 3.0       # exponential decay rate (1/m)
inflation/lethal_step_threshold: 0.95    # normalised step_haz that seeds inflation

# --- Mapping (keyframe retention + worker scheduling) ---
# LOCAL: every scan is still binned exactly once (no PGO / re-bin -- the node never
# re-sends a pose for an existing keyframe), and eviction subtracts the retained per-cell
# moments, so the map itself does not need the cloud after the first bin. Clouds are kept
# anyway so publish_local_pointcloud can stitch the window's raw points; memory is bounded
# by the rolling window (window_size), which is enforced node-side, NOT here.
mapping/is_kf_optimization_enabled: true
mapping/num_local_keyframes: 10
mapping/global_adjustment_sleep: 0

# --- Ingestion (cloud filtering + buffering) ---
# LOCAL: cap the lidar range to the local grid extent so scans never overshoot the map.
pointcloud/robot_height: 3.5
pointcloud/max_range_base_frame: 6.0     # <= grid/half_size_traversability
pointcloud/min_range_base_frame: 1.0
pointcloud/use_pointcloud_buffer: false
pointcloud/use_ros_buffer: false

# --- Publishing (node) ---
node/publish_rate_hz: 10.0               # nav cadence for the cropped costmap
